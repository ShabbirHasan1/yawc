[package]
name = "yawc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

[dependencies.yawc]
path = ".."
features = ["zlib"]

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_read"
path = "fuzz_targets/websocket_read.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
